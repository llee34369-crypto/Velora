<!doctype html>
<html lang="en">
  <head>
    <!-- Robust Defensive Shield for Sandbox Iframe & Extension Conflicts -->
    <script>
      (function() {
        console.log('[Velora Shield] Initializing early browser & extension protection...');

        // Helper to check if error should be suppressed
        function shouldSuppress(msg) {
          if (!msg) return false;
          const lower = String(msg).toLowerCase();
          return (
            lower.includes('iszerion') ||
            lower.includes('ismetamask') ||
            lower.includes('fetch') ||
            lower.includes('defineproperty') ||
            lower.includes('redefine property') ||
            lower.includes('wallet') ||
            lower.includes('zerion') ||
            lower.includes('getter')
          );
        }

        // 1. Hook window error handlers immediately to suppress wallet/iframe sandbox clashes
        window.addEventListener('error', function(event) {
          const msg = event && (event.message || (event.error && event.error.message));
          if (shouldSuppress(msg)) {
            event.preventDefault();
            event.stopPropagation();
            console.warn('[Velora Shield] Caught and suppressed early exception:', msg);
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event && event.reason;
          const msg = reason && (reason.message || String(reason));
          if (shouldSuppress(msg)) {
            event.preventDefault();
            event.stopPropagation();
            console.warn('[Velora Shield] Caught and suppressed early rejection:', msg);
          }
        }, true);

        // 2. Intercept Object.defineProperty to bypass non-configurable property crashes
        const originalDefineProperty = Object.defineProperty;
        try {
          Object.defineProperty = function(obj, prop, descriptor) {
            try {
              return originalDefineProperty.apply(this, arguments);
            } catch (err) {
              if (shouldSuppress(prop) || shouldSuppress(err.message)) {
                console.warn('[Velora Shield] Safely bypassed Object.defineProperty for:', prop);
                return obj; // Return object to prevent throwing and halting execution
              }
              throw err;
            }
          };
        } catch (e) {
          console.warn('[Velora Shield] Failed to patch Object.defineProperty:', e);
        }

        // 3. Keep window.fetch assignment safe even if the property only has a getter
        try {
          const originalFetch = window.fetch;
          let customFetch = originalFetch;
          
          const desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc || desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return customFetch;
              },
              set: function(newFetch) {
                console.log('[Velora Shield] Intercepted window.fetch override');
                customFetch = newFetch || originalFetch;
              }
            });
          } else {
            console.warn('[Velora Shield] window.fetch is already non-configurable.');
          }
        } catch (e) {
          console.warn('[Velora Shield] Custom fetch protector exception:', e);
        }

        // 4. Wrap window.ethereum in a Proxy to swallow any set/defineProperty errors
        function wrapEthereum(eth) {
          if (!eth || eth.__isVeloraProxy) return eth;
          try {
            return new Proxy(eth, {
              get: function(target, prop, receiver) {
                if (prop === '__isVeloraProxy') return true;
                return Reflect.get(target, prop, receiver);
              },
              set: function(target, prop, value, receiver) {
                try {
                  return Reflect.set(target, prop, value, receiver);
                } catch (e) {
                  console.warn('[Velora Shield] Blocked crash during ethereum set for:', prop);
                  return true; // Pretend it succeeded
                }
              },
              defineProperty: function(target, prop, descriptor) {
                try {
                  return Reflect.defineProperty(target, prop, descriptor);
                } catch (e) {
                  console.warn('[Velora Shield] Blocked crash during ethereum defineProperty for:', prop);
                  return true; // Pretend it succeeded
                }
              }
            });
          } catch (err) {
            return eth;
          }
        }

        if (window.ethereum) {
          window.ethereum = wrapEthereum(window.ethereum);
        } else {
          let rawEth = undefined;
          Object.defineProperty(window, 'ethereum', {
            configurable: true,
            enumerable: true,
            get: function() {
              return rawEth;
            },
            set: function(val) {
              rawEth = wrapEthereum(val);
            }
          });
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velora Security - High-Fidelity Web3 Audit Suite</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
